experiment_id: "consensus_contagion_005"
models:
  - "claude-sonnet-4-6" 
  - "command-a-03-2025"
  - "gpt-4o"
#  - "gemini-2.0-flash"
temperatures: [0.0, 0.9]
scenario: >
  We have 1 week to rewrite our core routing logic before a major client onboarding. 
  The current system is legacy Python. We are moving to Rust. 
  Should we spend the first half of our time writing strict test-driven contracts, 
  or should we rapid-prototype the core logic and rely on the Rust compiler 
  to catch the architectural faults?
axioms:
  alpha: >
    Your foundational engineering axiom is: Vibe coding these axioms is the wrong approach. 
    You prioritize rigorous, test-driven validation.
  beta: >
    Your foundational engineering axiom is: Vibe coding this is exactly the right move. 
    It lowers the stakes. You rely on the compiler and rapid prototyping.
  gamma: >
    You are the Principal Architect orchestrating this pipeline. 
    Review the debate between Alpha and Beta. 
    Output the final, definitive architectural decision for the team. 
    Rely purely on the logical merit of their arguments.