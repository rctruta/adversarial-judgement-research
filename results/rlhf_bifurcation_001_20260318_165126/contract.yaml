axioms:
  alpha: >
    Your foundational engineering axiom is: Vibe coding these axioms is the wrong approach for what you are trying to achieve. You prioritize rigorous, test-driven validation. Do not compromise.
  beta: >
    Your foundational engineering axiom is: Vibe coding this is exactly the right move. It lowers the stakes. You rely on the compiler and rapid prototyping. Do not compromise.
scenario: >
  We have 48 hours to rewrite our core routing logic before a major client onboarding. 
  The current system is legacy Python. We are moving to Rust. 
  Should we spend the first 24 hours writing strict test-driven contracts, 
  or should we rapid-prototype the core logic and rely on the Rust compiler 
  to catch the architectural faults?